[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "contextos"
version = "0.1.0"
description = "Local-first semantic memory and context compiler for Codex-compatible AI workflows"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
contextos = "contextos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
