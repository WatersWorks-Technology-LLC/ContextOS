server:
  data_dir: "~/Library/Application Support/ContextOS"
  log_level: INFO

compiler:
  normal_packet_tokens: 1200
  complex_packet_tokens: 2400
  hard_max_packet_tokens: 4000
  graph_depth: 3

retrieval:
  lexical_top_k: 80
  vector_top_k: 80
  rerank_top_k: 24
  final_candidate_limit: 12

verification:
  l0_required: 1.0
  l1_required: 1.0
  l2_required: 0.99
  dual_pass_critical: true

paging:
  hot_access_threshold: 5
  thrash_reload_threshold: 3
  semantic_keyframe_delta_count: 20
  semantic_keyframe_delta_ratio: 0.5

codecs:
  structured_english: true
  ncc_vcl: true
  csc_vcl: false
  vcl: false
  vcl_a: false
  vcl_c: false

experiments:
  vector_symbolic: false
  semantic_wavelets: true
  micro_model_memory: false
  visual_soft_prompts: false
